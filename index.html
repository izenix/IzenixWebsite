<style>
    .marquee-container {
        position: fixed;
        top: 0;
        width: 700px;
        overflow: hidden;
        z-index: 1000;
        background-color: transparent;
    }

    .marquee {
        display: inline-block;
        white-space: nowrap;
        animation: marquee 10s linear infinite;
        font-size: 20px;
        color: #d32f2f;
        font-weight: bold;
    }

    .marquee img {
        vertical-align: middle;
        margin-right: 5px;
    }

    @keyframes marquee {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
    }
</style>
